<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puter.js AI Test – Kino</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f13;
      color: #e2e2e8;
      min-height: 100vh;
      padding: 32px 16px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { color: #888; font-size: 14px; margin-bottom: 24px; }
    #status {
      background: #1a1a22;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 16px;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 24px;
      min-height: 48px;
    }
    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .card {
      background: #1a1a22;
      border: 1px solid #2a2a35;
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-4px); border-color: #7c3aed; }
    .poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      background: #252530;
    }
    .poster-placeholder {
      width: 100%;
      aspect-ratio: 2/3;
      background: #252530;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 36px;
    }
    .card-body { padding: 12px; }
    .card-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
    .card-meta { font-size: 11px; color: #888; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      background: #7c3aed22;
      color: #a78bfa;
      border: 1px solid #7c3aed44;
      margin-top: 6px;
    }
    .error { color: #f87171; font-size: 13px; }
    button {
      background: #7c3aed;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 24px;
    }
    button:hover { background: #6d28d9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    pre { white-space: pre-wrap; word-break: break-all; font-size: 11px; color: #6b7280; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>🎬 Puter.js AI Test</h1>
  <p>Testing AI search via Puter.js for "A Knight of the Seven Kingdoms"</p>

  <button id="runBtn" onclick="runTest()">▶ Run Test</button>

  <div id="status">Waiting to start…</div>
  <div id="results"></div>
  <pre id="rawJson"></pre>

  <script>
    function setStatus(msg, isError = false) {
      const el = document.getElementById('status');
      el.innerHTML = msg;
      el.style.color = isError ? '#f87171' : '#aaa';
    }

    function renderResults(results) {
      const container = document.getElementById('results');
      container.innerHTML = '';

      if (!results || results.length === 0) {
        container.innerHTML = '<p style="color:#888">No results found.</p>';
        return;
      }

      results.forEach(r => {
        const card = document.createElement('div');
        card.className = 'card';

        let posterHtml = '';
        if (r.artworkUrl100) {
          posterHtml = `<img class="poster" src="${r.artworkUrl100}" alt="" onerror="this.parentElement.innerHTML='<div class=poster-placeholder>🎬</div>'" />`;
        } else {
          posterHtml = `<div class="poster-placeholder">🎬</div>`;
        }

        const year = r.releaseDate ? r.releaseDate.split('-')[0] : '';
        const genres = (r.genres || []).slice(0, 3).join(', ');

        card.innerHTML = `
          ${posterHtml}
          <div class="card-body">
            <div class="card-title">${r.trackName || 'Unknown'}</div>
            <div class="card-meta">${year}${genres ? ' · ' + genres : ''}</div>
            ${r.episodesTotal ? `<div class="card-meta">${r.episodesTotal} episodes</div>` : ''}
            ${r.imdbId ? `<span class="badge">IMDb: ${r.imdbId}</span>` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function runTest() {
      const btn = document.getElementById('runBtn');
      btn.disabled = true;
      document.getElementById('results').innerHTML = '';
      document.getElementById('rawJson').textContent = '';

      const query = 'A Knight of the Seven Kingdoms';
      const type = 'Series';

      const today = new Date().toISOString().split('T')[0];

      setStatus(`⏳ Querying Puter.js AI for "${query}"… (Today: ${today})`);

      const prompt = `Today's date is ${today}. Find likely ${type} matches for: "${query}".

Return only a JSON array. No markdown. No commentary.
Each result must match:
{
  "trackName": "Official title",
  "artworkUrl100": "direct poster/image URL if verified, otherwise empty",
  "releaseDate": "YYYY-MM-DD if known",
  "genres": ["Genre"],
  "episodesTotal": 0,
  "imdbId": "tt... if known"
}

Rules:
- Return up to 6 strong matches.
- Match the requested type exactly: ${type}.
- Prefer official, IMDb, TMDB, TVGuide, Wikipedia, MyAnimeList, or AniList sources.
- CRITICAL: Today is ${today}. For episodesTotal, only count episodes that have actually AIRED on or before ${today}. Do NOT include unaired/upcoming/planned episodes.
- For currently-airing shows like "A Knight of the Seven Kingdoms", use the real aired episode count as of ${today}, not the announced season episode count.
- For artworkUrl100, retrieve the exact poster image path/URL from your knowledge if you are highly confident it is correct (e.g. TMDB direct URLs like https://image.tmdb.org/t/p/w500/<hash>.jpg).
- TMDB poster URLs look like: https://image.tmdb.org/t/p/w500/<hash>.jpg
- IMDb/Amazon poster URLs look like: https://m.media-amazon.com/images/M/<hash>.jpg
- DO NOT invent or guess a random hash. If unsure, set "artworkUrl100" to "".
- DO NOT use temporary, private, or expiring URLs.`;

      try {
        setStatus(`⏳ Sending request to Puter.js (model: openai/gpt-4o-mini)…`);

        const response = await puter.ai.chat(prompt, {
          model: 'openai/gpt-4o-mini'
        });

        let rawText = '';
        if (typeof response === 'string') {
          rawText = response;
        } else if (response?.message?.content) {
          const content = response.message.content;
          if (Array.isArray(content)) {
            rawText = content.map(c => c.text || '').join('');
          } else {
            rawText = String(content);
          }
        } else {
          rawText = String(response);
        }

        setStatus(`✅ Got response. Parsing JSON…`);
        document.getElementById('rawJson').textContent = 'Raw response:\n' + rawText.slice(0, 1000);

        // Extract JSON array from response
        const fenced = rawText.match(/```(?:json)?\s*([\s\S]*?)```/i);
        const raw = fenced?.[1] || rawText;
        const start = raw.indexOf('[');
        const end = raw.lastIndexOf(']');

        if (start === -1 || end === -1) {
          throw new Error('No JSON array found in response');
        }

        const jsonStr = raw.slice(start, end + 1);
        const results = JSON.parse(jsonStr);

        setStatus(`✅ Success! Found ${results.length} results via Puter.js AI (gpt-4o-mini).`);
        renderResults(results);

      } catch (err) {
        console.error('Puter.js test failed:', err);
        setStatus(`❌ Error: ${err.message}`, true);

        // Try fallback model
        setStatus(`⏳ Retrying with claude-3-5-haiku…`);
        try {
          const response2 = await puter.ai.chat(prompt, {
            model: 'anthropic/claude-haiku-4-5'
          });

          let rawText2 = '';
          if (response2?.message?.content) {
            const content = response2.message.content;
            if (Array.isArray(content)) {
              rawText2 = content.map(c => c.text || '').join('');
            } else {
              rawText2 = String(content);
            }
          } else {
            rawText2 = String(response2);
          }

          const fenced2 = rawText2.match(/```(?:json)?\s*([\s\S]*?)```/i);
          const raw2 = fenced2?.[1] || rawText2;
          const start2 = raw2.indexOf('[');
          const end2 = raw2.lastIndexOf(']');

          if (start2 !== -1 && end2 !== -1) {
            const results2 = JSON.parse(raw2.slice(start2, end2 + 1));
            setStatus(`✅ Success via fallback (claude-haiku)! Found ${results2.length} results.`);
            renderResults(results2);
            document.getElementById('rawJson').textContent = 'Raw response:\n' + rawText2.slice(0, 1000);
          }
        } catch (err2) {
          setStatus(`❌ All models failed: ${err2.message}`, true);
        }
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
