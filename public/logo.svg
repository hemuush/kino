<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Black background with red border -->
  <rect x="2" y="2" width="116" height="116" fill="#080808" stroke="#E50000" stroke-width="3"/>

  <!-- Inner continuous grey ring -->
  <circle cx="60" cy="60" r="17" fill="none" stroke="#999999" stroke-width="3.5"/>

  <!-- Outer broken white ring -->
  <!-- Using dasharray to create the 4 uniform breaks seen in the original image -->
  <circle cx="60" cy="60" r="32" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="35 15.2" transform="rotate(45 60 60)" />

  <!-- Center Play Button (White Triangle with slightly rounded corners) -->
  <polygon points="53,48 53,72 73,60" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
</svg>
